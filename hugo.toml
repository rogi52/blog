baseURL = 'https://rogi52.github.io/blog/'
languageCode = 'ja'
DefaultContentLanguage = "ja"
hasCJKLanguage = true
title = 'Rogi'
theme = 'hugo-theme-stack'

[social]
  twitter = "rogi_52"

[params]
  mainSections = ["posts"]

    [params.sidebar]
        name = "Rogi"
        bio = "biioooo"
        subtitle = "algorithm"

        [params.sidebar.avatar]
            enabled = true
            local = true
            src = "images/mob.png"

    [params.article]
        readingTime = false
        math = true
        toc = true

    [params.dateFormat]
        published = "2006年01月02日"
        lastUpdated = "2006年01月02日"
  
    [params.opengraph.twitter]
        card = "summary_large_image"

    [[params.widgets.page]]
        type = "toc"

    [[params.widgets.homepage]]
        type = "profile"

    # [[params.widgets.homepage]]
    # type = "archives"

    [[params.widgets.homepage]]
        type = "categories"

    [[params.widgets.homepage]]
        type = "tag-cloud"

    [markup.tableOfContents]
        ordered = true  # 番号付きリストにする
        startLevel = 2
        endLevel = 4


[menu]
  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/rogi52"
    params = { icon = "brand-github" }

  [[menu.social]]
    identifier = "twitter"
    name = "Twitter"
    url = "https://twitter.com/rogi_52"
    params = { icon = "brand-twitter" }

enableGitInfo = true

[frontmatter]
    date = ["date", "publishDate", "lastmod", ":fileModTime"]
    lastmod = [":git", ":fileModTime", "lastmod", "date"]

[markup.goldmark.renderer]
  unsafe = true


[markup.highlight]
  codeFences = true
  guessSyntax = true
  lineNos = false
  style = "github"